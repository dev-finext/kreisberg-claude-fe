<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <title>חישובים בראש טוב — כתבי כמויות</title>
    <script>
      // GitHub Pages SPA fallback: remember the requested deep link, then load the app
      // from its root. This file references no hashed assets, so it never goes stale.
      (function () {
        var base = "/kreisberg-claude-fe/";
        var path = location.pathname + location.search + location.hash;
        try {
          sessionStorage.setItem("spa-redirect", path);
        } catch (e) {
          /* ignore */
        }
        location.replace(base);
      })();
    </script>
  </head>
  <body style="margin:0;background:#e8edf5"></body>
</html>
